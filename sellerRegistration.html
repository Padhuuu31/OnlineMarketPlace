<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Registration</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="register-page">

<div class="left-side">
<h1>🏪 Become a Seller</h1>

<h2>Start Your Business Today</h2>

<p>
✔ Reach Thousands of Customers<br><br>
✔ Easy Product Listing<br><br>
✔ Secure Payments<br><br>
✔ Grow Your Business
</p>

</div>

<div class="form-box">

<h2>Seller Registration</h2>

<form>

<input type="text" placeholder="🏪 Shop Name" required>

<input type="text" placeholder="👤 Owner Name" required>

<input type="email" placeholder="📧 Email Address" required>

<input type="tel" placeholder="📱 Phone Number" required>

<input type="password" placeholder="🔒 Password" required>

<button>Register as Seller</button>

</form>

</div>

</div>

</body>
</html>
